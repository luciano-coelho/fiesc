# .github/workflows/ai_pr_review.yml

name: "Auditoria de testes com IA (Groq)"

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  ai_test_audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
    - name: Checkout do Código
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Configurar Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar Dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Calcular Diff do PR
      id: get_diff
      run: |
        echo "Fetching base branch..."
        git fetch origin ${{ github.base_ref }}
        
        echo "Calculando diff..."
        DIFF_CONTENT=$(git diff origin/${{ github.base_ref }}..HEAD)
        
        if [ -z "$DIFF_CONTENT" ]; then
          echo "Diff vazio encontrado"
          DIFF_CONTENT="Nenhuma alteração detectada no diff."
        fi
        
        TRUNCATED_DIFF=$(echo "$DIFF_CONTENT" | head -c 15000)
        echo "PR_DIFF<<EOF" >> $GITHUB_ENV
        echo "$TRUNCATED_DIFF" >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV
        
        echo "Diff calculado com sucesso"

    - name: Chamar a API do Groq
      id: ai_analysis
      env:
        AI_API_KEY: ${{ secrets.AI_API_KEY }}
      run: |
        RESPONSE=$(python scripts/call_ai_model.py)
        echo "AI_RESPONSE<<EOF" >> $GITHUB_ENV
        echo "$RESPONSE" >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV

    - name: Postar Análise no PR
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const aiResponse = process.env.AI_RESPONSE;
          if (!aiResponse || aiResponse.trim() === "" || aiResponse.trim() === "Diff vazio ou não fornecido. Nenhum código para analisar.") {
            console.log("Sem resposta da IA ou diff vazio. Pulando comentário.");
            return;
          }
          
          const body = `### Auditoria de Testes (IA via Groq)\n\n${aiResponse}`;

          github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body: body
          });